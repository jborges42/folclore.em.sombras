<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quadro do palco</title>
<style>
  html, body { margin: 0; height: 100%; background: #0D0906; overflow: hidden; }
  #escala { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
</style>
</head>
<body>
<div id="escala"></div>
<script src="../../js/vendor/gsap.min.js"></script>
<script src="../../js/grafismos.js"></script>
<script src="../../js/palco.js"></script>
<script src="../../js/cenario.js"></script>
<script src="../../js/bonecos.js"></script>
<script>
/* Protótipo: um quadro do espetáculo em loop. Parâmetros: ?t=SEGUNDOS&pausa=1 congela;
   ?luz=noite (estado de luz), ?vagalumes=1&chuva=1&relampago=1, ?camera=PX (paralaxe), ?z=0..1 (Curupira longe da tela). */
(function () {
  const q = new URLSearchParams(location.search);
  const t0 = parseFloat(q.get('t')) || 0, pausa = q.get('pausa') === '1';
  const el = document.getElementById('escala');
  function ajustar() {
    const k = Math.min(innerWidth / 1920, innerHeight / 1080);
    el.style.transform = `translate(${(innerWidth - 1920 * k) / 2}px,${(innerHeight - 1080 * k) / 2}px) scale(${k})`;
  }
  ajustar();
  addEventListener('resize', ajustar);

  const B = Sombras.bonecos;
  const palco = Sombras.palco.criar(el, { luz: q.get('luz') || 'lamparina' });
  for (const k of ['vagalumes', 'chuva', 'poeira', 'brasas']) if (q.has(k)) palco.particulas[k] = +q.get(k);
  if (q.has('relampago')) for (let i = 0; i < 20; i++) palco.relampagos.push(1 + i * 3.7);
  palco.camera.x = +q.get('camera') || 0;
  Sombras.cenario.montar(palco, Sombras.cenario.mata({ semente: 7 }));

  // rastro do Curupira atrás dele, no chão claro da clareira: dedos para trás, apontando para o caçador
  const rastro = palco.adicionar(B.pegadas());
  [[905, 809], [818, 802], [726, 810], [632, 803], [548, 810]].forEach(([x, y], i) =>
    rastro.por(x, y, { dir: 1, invertida: true, lado: i % 2 ? -1 : 1, escala: 1.6, achatar: .58, giro: (i % 2 ? 5 : -4), opacidade: .55 }));

  const tiao = palco.adicionar(B.tiao({ x: 430, y: 802, escala: 1.15 }));
  const curupira = palco.adicionar(B.curupira({ x: 1010, y: 800, escala: 1.65 }));
  // ciclo do quadro: 3 passos no lugar (2,7 s) e 1,7 s de pose parada de perfil, pé de trás suspenso mostrando
  // a sola com os dedos virados, boca aberta num riso (dentes verdes) e o olhar aceso
  const CICLO = 4.4, ANDA = 2.7;
  curupira.motores.push((b, t) => {
    const u = ((t % CICLO) + CICLO) % CICLO;
    B.andar(b, u < ANDA ? u / .9 : 0, { pernas: 18, bracos: 7, bob: 10 });
    const k = u < ANDA ? 0 : Math.min(1, (u - ANDA) / .18) * Math.min(1, (CICLO - u) / .18);
    b.extra.a.pernaTras = (b.extra.a.pernaTras || 0) + 34 * k;
    b.extra.a.peTras = (b.extra.a.peTras || 0) + 6 * k;
    b.extra.a.cabeca = (b.extra.a.cabeca || 0) - 6 * k;
    b.extra.boca = .85 * k; b.extra.furia = .35 * k;
    B.respirar(b, t, { amp: .6 });
  });
  tiao.motores.push((b, t) => { B.respirar(b, t, { amp: 1.2 }); });
  curupira.pose.z = +q.get('z') || 0;

  if (pausa) { palco.quadro(t0); return; }
  const ini = performance.now();
  (function loop() { palco.quadro(t0 + (performance.now() - ini) / 1000); requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>
